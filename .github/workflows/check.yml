name: Code Quality & Security Checks

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  secrets:
    name: Secret Scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect secrets with truffleHog
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch || 'main' }}
          head: HEAD
        continue-on-error: true

  python-quality:
    name: Python Code Quality
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install -r requirements.txt

      - name: Check formatting with black
        run: black --check src/ tests/

      - name: Check import sorting with isort
        run: isort --check-only src/ tests/

      - name: Lint with flake8
        run: flake8 src/ tests/ --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Type check with mypy
        run: mypy src/tsdbenv --ignore-missing-imports

      - name: Lint with pylint
        run: pylint src/tsdbenv --disable=all --enable=E,F --exit-zero

      - name: Run tests
        run: >-
          pytest tests/ -v
          --ignore=tests/integration/test_docker_real.py
          --ignore=tests/integration/test_podman_engine.py
          --cov=src/tsdbenv
          --cov-report=term-missing
          --cov-fail-under=65

  bandit:
    name: Security Analysis with Bandit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install bandit
        run: pip install bandit

      - name: Run bandit security scan
        run: bandit -r src/ -ll -f json -o bandit-report.json || true

      - name: Display bandit results
        run: |
          if [ -f bandit-report.json ]; then
            cat bandit-report.json | python -m json.tool
          fi
